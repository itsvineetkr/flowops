key: laravel
name: PHP + Laravel
language: PHP
category: Full-stack
description: Laravel on Apache with MySQL.
detect: {files: [composer.json, artisan], deps: [laravel/framework]}
dockerfile:
  - from: {image: "composer:2", as: vendor}
  - workdir: {path: /app}
  - copy: {src: composer.json composer.lock, dest: ./}
  - run: {command: composer install --no-dev --no-scripts --prefer-dist}
  - from: {image: "php:8.3-apache"}
  - env: {key: APACHE_DOCUMENT_ROOT, value: /var/www/html/public}
  - run: {command: "sed -ri -e 's!/var/www/html!${APACHE_DOCUMENT_ROOT}!g' /etc/apache2/sites-available/*.conf && a2enmod rewrite && docker-php-ext-install pdo_mysql"}
  - workdir: {path: /var/www/html}
  - copy: {src: ., dest: .}
  - copy: {from: vendor, src: /app/vendor, dest: ./vendor}
  - expose: {port: 80}
compose:
  - service: {_id: db, name: db, image: "mysql:8", environment: {MYSQL_DATABASE: app, MYSQL_USER: app, MYSQL_PASSWORD: app, MYSQL_ROOT_PASSWORD: root}, volumes: ["mysqldata:/var/lib/mysql"]}
  - service: {name: web, build: ., ports: ["8080:80"], environment: {DB_HOST: db, DB_DATABASE: app, DB_USERNAME: app, DB_PASSWORD: app}}
pipeline:
  - trigger: {events: [push, pull_request], branches: [main]}
  - checkout: {}
  - setup_runtime: {runtime: php, version: "8.3"}
  - install: {command: composer install --prefer-dist --no-progress}
  - test: {command: vendor/bin/phpunit}
  - docker_build: {image: "web:${{ github.sha }}"}
