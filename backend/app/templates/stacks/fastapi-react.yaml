key: fastapi-react
name: FastAPI + React
language: Python / TypeScript
category: Full-stack
description: FastAPI with React + Vite and PostgreSQL. Expects backend/ and frontend/; backend main.py must serve the React build from /app/static.
detect: {files: [requirements.txt, pyproject.toml, package.json], deps: [fastapi, react, vite]}
dockerfile:
  - from: {image: node:22-alpine, as: frontend}
  - workdir: {path: /frontend}
  - copy: {src: frontend/package*.json, dest: ./}
  - run: {command: npm ci}
  - copy: {src: frontend/, dest: .}
  - run: {command: npm run build}
  - from: {image: python:3.12-slim}
  - workdir: {path: /app}
  - copy: {src: backend/requirements.txt, dest: .}
  - run: {command: pip install --no-cache-dir -r requirements.txt}
  - copy: {src: backend/, dest: .}
  - copy: {from: frontend, src: /frontend/dist, dest: /app/static}
  - expose: {port: 8000}
  - cmd: {args: [uvicorn, main:app, --host, 0.0.0.0, --port, "8000"]}
compose:
  - service: {_id: db, name: db, image: postgres:16-alpine, environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}, volumes: ["pgdata:/var/lib/postgresql/data"]}
  - service: {name: app, build: ., ports: ["8000:8000"], environment: {DATABASE_URL: "postgresql://app:app@db:5432/app"}}
pipeline:
  - trigger: {events: [push, pull_request], branches: [main]}
  - checkout: {}
  - setup_runtime: {runtime: python, version: "3.12"}
  - setup_runtime: {runtime: node, version: "22"}
  - install: {command: pip install -r backend/requirements.txt && pip install pytest ruff && npm ci --prefix frontend}
  - lint: {command: ruff check backend && npm run lint --prefix frontend --if-present, _after: [install]}
  - test: {command: cd backend && python -m pytest, _after: [install]}
  - build: {command: npm test --prefix frontend --if-present && npm run build --prefix frontend, _after: [install]}
  - docker_build: {image: "app:${{ github.sha }}", _after: [lint, test, build]}
