key: rust
name: Rust
language: Rust
category: Backend
description: Cargo release build on a slim Debian image.
placeholders:
  rust_binary: {default: app, label: Cargo binary name}
detect: {files: [Cargo.toml]}
dockerfile:
  - from: {image: "rust:1.82", as: build}
  - workdir: {path: /app}
  - copy: {src: ., dest: .}
  - run: {command: cargo build --release}
  - from: {image: debian:bookworm-slim}
  - copy: {from: build, src: "/app/target/release/{{rust_binary}}", dest: "/usr/local/bin/{{rust_binary}}"}
  - cmd: {args: ["{{rust_binary}}"]}
compose:
  - service: {name: app, build: ., ports: ["8080:8080"]}
pipeline:
  - trigger: {events: [push, pull_request], branches: [main]}
  - checkout: {}
  - setup_runtime: {runtime: rust, version: stable}
  - lint: {command: cargo clippy -- -D warnings, _after: [setup_runtime]}
  - test: {command: cargo test, _after: [setup_runtime]}
  - build: {command: cargo build --release, _after: [lint, test]}
  - docker_build: {image: "app:${{ github.sha }}"}
